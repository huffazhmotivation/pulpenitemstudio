name = "pulpenitem-studio"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Content + admin accounts (Cloudflare D1, free tier).
# Create once with: npx wrangler d1 create pulpenitem-studio
# then paste the printed database_id below.
[[d1_databases]]
binding = "DB"
database_name = "pulpenitem-studio"
database_id = "aca1f1eb-afa3-4021-b37f-be8c61c137e3"
migrations_dir = "migrations"

# Font previews, gallery images and private master files (Cloudflare R2, free tier).
# Create once with: npx wrangler r2 bucket create pulpenitem-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "pulpenitem-media"

[vars]
NEXT_PUBLIC_SITE_URL = "https://pulpenitem.studio"

# Secret (never commit): npx wrangler secret put AUTH_SECRET
