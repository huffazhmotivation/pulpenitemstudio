name = "pulpenitem-studio"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Optional: bind a KV namespace for Next.js incremental cache.
# Create with: wrangler kv namespace create NEXT_CACHE
# [[kv_namespaces]]
# binding = "NEXT_CACHE_WORKERS_KV"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

[vars]
NEXT_PUBLIC_SITE_URL = "https://pulpenitemstudio.huffazh-motivation.workers.dev"
